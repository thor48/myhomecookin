# Builds the app's Docker image and publishes it to GitHub's registry:
#   ghcr.io/thor48/myhomecookin:latest      (newest build of main)
#   ghcr.io/thor48/myhomecookin:sha-<commit> (every build, for rolling back)
# Unraid pulls :latest. Secrets (ANTHROPIC_API_KEY) and MEALIE_URL are set on
# the container, never built into the image.
name: Build and publish image

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "MyHomeCookin_Logo-StyleGuide/**"
  workflow_dispatch: # "Run workflow" button on the Actions tab

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/myhomecookin

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub's registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=My Home Cookin'
            org.opencontainers.image.description=Family recipe site on top of Mealie

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Unraid runs on x86-64.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DEPLOYMENT_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
