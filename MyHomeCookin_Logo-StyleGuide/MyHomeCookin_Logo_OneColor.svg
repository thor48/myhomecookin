<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520">
  <!-- Flat one-color version (Deep Brown) - ideal for single-color printing, embossing, or dark-mode inversion -->
  <g fill="#4A3429" stroke="#4A3429">
    
    <!-- House group -->
    <g transform="translate(80, 30)">
      <!-- Roof -->
      <path d="M120 20 L20 100 L220 100 Z" fill="none" stroke-width="10" stroke-linejoin="round"/>
      
      <!-- House body -->
      <rect x="30" y="100" width="180" height="140" fill="none" stroke-width="10"/>
      
      <!-- Window -->
      <rect x="95" y="120" width="50" height="40" fill="none" stroke-width="4"/>
      <line x1="120" y1="120" x2="120" y2="160" stroke-width="3"/>
      <line x1="95" y1="140" x2="145" y2="140" stroke-width="3"/>
      
      <!-- Chimney -->
      <rect x="175" y="60" width="22" height="50" fill="#4A3429" stroke="none"/>
      
      <!-- Spoon -->
      <g transform="translate(186, 45) rotate(-15)">
        <ellipse cx="0" cy="0" rx="8" ry="18" fill="#4A3429" stroke="none"/>
        <rect x="-4" y="-25" width="8" height="30" rx="3" fill="#4A3429" stroke="none"/>
      </g>
      
      <!-- Steam -->
      <path d="M100 95 Q105 80 100 70" fill="none" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M115 90 Q120 75 115 65" fill="none" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M130 95 Q135 80 130 70" fill="none" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Pot (solid) -->
      <ellipse cx="120" cy="195" rx="55" ry="18" fill="#4A3429" stroke="none"/>
      <rect x="70" y="175" width="100" height="30" rx="5" fill="#4A3429" stroke="none"/>
      <ellipse cx="120" cy="175" rx="55" ry="12" fill="#4A3429" stroke="none"/>
      <!-- Handles -->
      <path d="M70 185 Q55 185 55 195 Q55 205 70 205" fill="none" stroke-width="6"/>
      <path d="M170 185 Q185 185 185 195 Q185 205 170 205" fill="none" stroke-width="6"/>
      <!-- Knob -->
      <circle cx="120" cy="168" r="6" fill="#4A3429" stroke="none"/>
      
      <!-- Leaves left -->
      <g transform="translate(55, 210)" stroke="none">
        <path d="M0 10 Q-15 0 -25 15 Q-15 25 0 20 Q5 15 0 10" fill="#4A3429"/>
        <path d="M5 5 Q-5 -10 -20 0 Q-5 10 5 10" fill="#4A3429"/>
      </g>
      
      <!-- Leaves right -->
      <g transform="translate(185, 210)" stroke="none">
        <path d="M0 10 Q15 0 25 15 Q15 25 0 20 Q-5 15 0 10" fill="#4A3429"/>
        <path d="M-5 5 Q5 -10 20 0 Q5 10 -5 10" fill="#4A3429"/>
      </g>
      
      <!-- Heart -->
      <path d="M120 230 C115 225 105 225 105 235 C105 245 120 255 120 255 C120 255 135 245 135 235 C135 225 125 225 120 230 Z" fill="#4A3429" stroke="none"/>
    </g>
    
    <!-- Decorative line -->
    <line x1="100" y1="310" x2="300" y2="310" stroke-width="1.5" fill="none"/>
    <circle cx="200" cy="310" r="3" fill="#4A3429" stroke="none"/>
    
    <!-- Main text -->
    <text x="200" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold" fill="#4A3429" stroke="none" text-anchor="middle">MyHome</text>
    <text x="200" y="410" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold" fill="#4A3429" stroke="none" text-anchor="middle">Cookin'</text>
    
    <!-- Decorative under text -->
    <line x1="120" y1="430" x2="180" y2="430" stroke-width="1.5" fill="none"/>
    <path d="M200 425 C197 422 192 422 192 428 C192 434 200 440 200 440 C200 440 208 434 208 428 C208 422 203 422 200 425 Z" fill="#4A3429" stroke="none"/>
    <line x1="220" y1="430" x2="280" y2="430" stroke-width="1.5" fill="none"/>
    
    <!-- Domain -->
    <text x="200" y="470" font-family="Georgia, serif" font-size="14" fill="#4A3429" stroke="none" text-anchor="middle">MyHomeCookin.com</text>
    
    <!-- Small leaves -->
    <path d="M95 465 Q85 460 80 470 Q88 475 95 470" fill="#4A3429" stroke="none"/>
    <path d="M305 465 Q315 460 320 470 Q312 475 305 470" fill="#4A3429" stroke="none"/>
  </g>
</svg>
