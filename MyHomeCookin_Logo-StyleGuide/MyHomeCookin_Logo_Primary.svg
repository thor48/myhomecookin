<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520">
  <!-- Background transparent -->
  
  <!-- Color definitions -->
  <defs>
    <style>
      .terracotta { fill: #C17F59; stroke: #C17F59; }
      .deep-brown { fill: #4A3429; }
      .cream { fill: #F8F1E9; }
      .pot-orange { fill: #C45C26; }
      .leaf { fill: #C17F59; }
      .text-brown { fill: #4A3429; }
      .accent { fill: #C17F59; stroke: #C17F59; }
    </style>
  </defs>
  
  <!-- House outline -->
  <g transform="translate(80, 30)">
    <!-- Roof -->
    <path d="M120 20 L20 100 L220 100 Z" fill="none" stroke="#C17F59" stroke-width="10" stroke-linejoin="round"/>
    
    <!-- House body -->
    <rect x="30" y="100" width="180" height="140" fill="#F8F1E9" stroke="#C17F59" stroke-width="10"/>
    
    <!-- Window -->
    <rect x="95" y="120" width="50" height="40" fill="#F8F1E9" stroke="#C17F59" stroke-width="4"/>
    <line x1="120" y1="120" x2="120" y2="160" stroke="#C17F59" stroke-width="3"/>
    <line x1="95" y1="140" x2="145" y2="140" stroke="#C17F59" stroke-width="3"/>
    
    <!-- Chimney -->
    <rect x="175" y="60" width="22" height="50" fill="#C17F59"/>
    
    <!-- Spoon (chimney top) -->
    <ellipse cx="186" cy="45" rx="8" ry="18" fill="#6B4C3A" transform="rotate(-15 186 45)"/>
    <rect x="182" y="20" width="8" height="30" fill="#6B4C3A" rx="3"/>
    
    <!-- Steam lines -->
    <path d="M100 95 Q105 80 100 70" fill="none" stroke="#C17F59" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M115 90 Q120 75 115 65" fill="none" stroke="#C17F59" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M130 95 Q135 80 130 70" fill="none" stroke="#C17F59" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Pot -->
    <ellipse cx="120" cy="195" rx="55" ry="18" fill="#C45C26"/>
    <rect x="70" y="175" width="100" height="30" rx="5" fill="#C45C26"/>
    <ellipse cx="120" cy="175" rx="55" ry="12" fill="#E07A3D"/>
    <!-- Pot handles -->
    <path d="M70 185 Q55 185 55 195 Q55 205 70 205" fill="none" stroke="#C45C26" stroke-width="6"/>
    <path d="M170 185 Q185 185 185 195 Q185 205 170 205" fill="none" stroke="#C45C26" stroke-width="6"/>
    <!-- Lid knob -->
    <circle cx="120" cy="168" r="6" fill="#4A3429"/>
    
    <!-- Leaves left -->
    <g transform="translate(55, 210)">
      <path d="M0 10 Q-15 0 -25 15 Q-15 25 0 20 Q5 15 0 10" fill="#C17F59"/>
      <path d="M5 5 Q-5 -10 -20 0 Q-5 10 5 10" fill="#C17F59"/>
    </g>
    
    <!-- Leaves right -->
    <g transform="translate(185, 210)">
      <path d="M0 10 Q15 0 25 15 Q15 25 0 20 Q-5 15 0 10" fill="#C17F59"/>
      <path d="M-5 5 Q5 -10 20 0 Q5 10 -5 10" fill="#C17F59"/>
    </g>
    
    <!-- Heart under pot -->
    <path d="M120 230 C115 225 105 225 105 235 C105 245 120 255 120 255 C120 255 135 245 135 235 C135 225 125 225 120 230 Z" fill="#C17F59"/>
  </g>
  
  <!-- Decorative line -->
  <line x1="100" y1="310" x2="300" y2="310" stroke="#C17F59" stroke-width="1.5"/>
  <circle cx="200" cy="310" r="3" fill="#C17F59"/>
  
  <!-- Main text -->
  <text x="200" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold" fill="#4A3429" text-anchor="middle">MyHome</text>
  <text x="200" y="410" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold" fill="#4A3429" text-anchor="middle">Cookin'</text>
  
  <!-- Decorative elements under text -->
  <line x1="120" y1="430" x2="180" y2="430" stroke="#C17F59" stroke-width="1.5"/>
  <path d="M200 425 C197 422 192 422 192 428 C192 434 200 440 200 440 C200 440 208 434 208 428 C208 422 203 422 200 425 Z" fill="#C17F59"/>
  <line x1="220" y1="430" x2="280" y2="430" stroke="#C17F59" stroke-width="1.5"/>
  
  <!-- Domain -->
  <text x="200" y="470" font-family="Georgia, serif" font-size="14" fill="#C17F59" text-anchor="middle">MyHomeCookin.com</text>
  
  <!-- Small leaves by domain -->
  <path d="M95 465 Q85 460 80 470 Q88 475 95 470" fill="#C17F59"/>
  <path d="M305 465 Q315 460 320 470 Q312 475 305 470" fill="#C17F59"/>
</svg>
