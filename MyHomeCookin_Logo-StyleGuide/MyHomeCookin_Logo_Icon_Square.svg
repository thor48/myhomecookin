<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <!-- Square icon version - house + pot mark only, optimized for favicon / app icon -->
  <defs>
    <style>
      .house-stroke { fill: none; stroke: #C17F59; stroke-width: 11; stroke-linejoin: round; stroke-linecap: round; }
      .house-fill { fill: #F8F1E9; stroke: #C17F59; stroke-width: 11; }
      .window { fill: #F8F1E9; stroke: #C17F59; stroke-width: 4.5; }
      .pot { fill: #C45C26; }
      .pot-lid { fill: #E07A3D; }
      .spoon { fill: #6B4C3A; }
      .accent { fill: #C17F59; }
      .steam { fill: none; stroke: #C17F59; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>
  
  <!-- Centered composition -->
  <g transform="translate(20, 18)">
    <!-- Roof -->
    <path d="M120 18 L18 105 L222 105 Z" class="house-stroke"/>
    
    <!-- House body -->
    <rect x="30" y="105" width="180" height="135" rx="2" class="house-fill"/>
    
    <!-- Window -->
    <rect x="95" y="122" width="50" height="38" class="window"/>
    <line x1="120" y1="122" x2="120" y2="160" stroke="#C17F59" stroke-width="3.5"/>
    <line x1="95" y1="141" x2="145" y2="141" stroke="#C17F59" stroke-width="3.5"/>
    
    <!-- Chimney -->
    <rect x="178" y="58" width="22" height="52" fill="#C17F59"/>
    
    <!-- Wooden spoon -->
    <g transform="translate(189, 38) rotate(-14)">
      <ellipse cx="0" cy="0" rx="9" ry="20" class="spoon"/>
      <rect x="-4.5" y="-28" width="9" height="32" rx="3" class="spoon"/>
    </g>
    
    <!-- Steam -->
    <path d="M98 98 Q105 80 98 65" class="steam"/>
    <path d="M115 94 Q122 76 115 60" class="steam"/>
    <path d="M132 98 Q139 80 132 65" class="steam"/>
    
    <!-- Pot -->
    <ellipse cx="120" cy="205" rx="56" ry="18" class="pot"/>
    <rect x="70" y="182" width="100" height="30" rx="5" class="pot"/>
    <ellipse cx="120" cy="182" rx="56" ry="13" class="pot-lid"/>
    <!-- Handles -->
    <path d="M70 192 Q54 192 54 204 Q54 216 70 216" fill="none" stroke="#C45C26" stroke-width="7" stroke-linecap="round"/>
    <path d="M170 192 Q186 192 186 204 Q186 216 170 216" fill="none" stroke="#C45C26" stroke-width="7" stroke-linecap="round"/>
    <!-- Lid knob -->
    <circle cx="120" cy="174" r="6.5" fill="#4A3429"/>
    
    <!-- Leaves left -->
    <g transform="translate(52, 218)">
      <path d="M0 10 Q-16 -2 -26 14 Q-14 26 0 20 Q5 14 0 10" class="accent"/>
      <path d="M6 2 Q-6 -14 -20 -2 Q-6 12 6 10" class="accent"/>
    </g>
    
    <!-- Leaves right -->
    <g transform="translate(188, 218)">
      <path d="M0 10 Q16 -2 26 14 Q14 26 0 20 Q-5 14 0 10" class="accent"/>
      <path d="M-6 2 Q6 -14 20 -2 Q6 12 -6 10" class="accent"/>
    </g>
    
    <!-- Heart -->
    <path d="M120 242 C114 236 103 236 103 248 C103 260 120 272 120 272 C120 272 137 260 137 248 C137 236 126 236 120 242 Z" class="accent"/>
  </g>
</svg>
