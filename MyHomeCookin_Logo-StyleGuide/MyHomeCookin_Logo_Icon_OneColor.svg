<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <!-- Flat one-color square icon (Deep Brown) -->
  <g fill="#4A3429" stroke="#4A3429">
    <g transform="translate(20, 18)">
      <!-- Roof -->
      <path d="M120 18 L18 105 L222 105 Z" fill="none" stroke-width="11" stroke-linejoin="round"/>
      
      <!-- House body -->
      <rect x="30" y="105" width="180" height="135" rx="2" fill="none" stroke-width="11"/>
      
      <!-- Window -->
      <rect x="95" y="122" width="50" height="38" fill="none" stroke-width="4.5"/>
      <line x1="120" y1="122" x2="120" y2="160" stroke-width="3.5"/>
      <line x1="95" y1="141" x2="145" y2="141" stroke-width="3.5"/>
      
      <!-- Chimney -->
      <rect x="178" y="58" width="22" height="52" fill="#4A3429" stroke="none"/>
      
      <!-- Spoon -->
      <g transform="translate(189, 38) rotate(-14)">
        <ellipse cx="0" cy="0" rx="9" ry="20" fill="#4A3429" stroke="none"/>
        <rect x="-4.5" y="-28" width="9" height="32" rx="3" fill="#4A3429" stroke="none"/>
      </g>
      
      <!-- Steam -->
      <path d="M98 98 Q105 80 98 65" fill="none" stroke-width="3" stroke-linecap="round"/>
      <path d="M115 94 Q122 76 115 60" fill="none" stroke-width="3" stroke-linecap="round"/>
      <path d="M132 98 Q139 80 132 65" fill="none" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Pot -->
      <ellipse cx="120" cy="205" rx="56" ry="18" fill="#4A3429" stroke="none"/>
      <rect x="70" y="182" width="100" height="30" rx="5" fill="#4A3429" stroke="none"/>
      <ellipse cx="120" cy="182" rx="56" ry="13" fill="#4A3429" stroke="none"/>
      <path d="M70 192 Q54 192 54 204 Q54 216 70 216" fill="none" stroke-width="7" stroke-linecap="round"/>
      <path d="M170 192 Q186 192 186 204 Q186 216 170 216" fill="none" stroke-width="7" stroke-linecap="round"/>
      <circle cx="120" cy="174" r="6.5" fill="#4A3429" stroke="none"/>
      
      <!-- Leaves -->
      <g transform="translate(52, 218)" stroke="none">
        <path d="M0 10 Q-16 -2 -26 14 Q-14 26 0 20 Q5 14 0 10" fill="#4A3429"/>
        <path d="M6 2 Q-6 -14 -20 -2 Q-6 12 6 10" fill="#4A3429"/>
