<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180" width="620" height="180">
  <defs>
    <style>
      .terracotta { fill: #C17F59; }
      .deep-brown { fill: #4A3429; }
      .cream { fill: #F8F1E9; }
      .pot { fill: #C45C26; }
    </style>
  </defs>
  
  <!-- Icon / Mark (left side) -->
  <g transform="translate(10, 15) scale(0.55)">
    <!-- Roof -->
    <path d="M120 20 L20 100 L220 100 Z" fill="none" stroke="#C17F59" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- House body -->
    <rect x="30" y="100" width="180" height="140" fill="#F8F1E9" stroke="#C17F59" stroke-width="12"/>
    
    <!-- Window -->
    <rect x="95" y="120" width="50" height="40" fill="#F8F1E9" stroke="#C17F59" stroke-width="5"/>
    <line x1="120" y1="120" x2="120" y2="160" stroke="#C17F59" stroke-width="4"/>
    <line x1="95" y1="140" x2="145" y2="140" stroke="#C17F59" stroke-width="4"/>
    
    <!-- Chimney -->
    <rect x="175" y="55" width="24" height="55" fill="#C17F59"/>
    
    <!-- Spoon -->
    <ellipse cx="187" cy="40" rx="9" ry="20" fill="#6B4C3A" transform="rotate(-12 187 40)"/>
    <rect x="183" y="12" width="9" height="35" fill="#6B4C3A" rx="3"/>
    
    <!-- Steam -->
    <path d="M100 95 Q106 78 100 65" fill="none" stroke="#C17F59" stroke-width="3" stroke-linecap="round"/>
    <path d="M115 90 Q121 73 115 60" fill="none" stroke="#C17F59" stroke-width="3" stroke-linecap="round"/>
    <path d="M130 95 Q136 78 130 65" fill="none" stroke="#C17F59" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Pot -->
    <ellipse cx="120" cy="200" rx="58" ry="20" fill="#C45C26"/>
    <rect x="68" y="178" width="104" height="32" rx="6" fill="#C45C26"/>
    <ellipse cx="120" cy="178" rx="58" ry="14" fill="#E07A3D"/>
    <!-- Handles -->
    <path d="M68 190 Q52 190 52 202 Q52 214 68 214" fill="none" stroke="#C45C26" stroke-width="7"/>
    <path d="M172 190 Q188 190 188 202 Q188 214 172 214" fill="none" stroke="#C45C26" stroke-width="7"/>
    <circle cx="120" cy="170" r="7" fill="#4A3429"/>
    
    <!-- Leaves -->
    <g transform="translate(50, 215)">
      <path d="M0 12 Q-18 0 -28 18 Q-15 28 0 22 Q6 16 0 12" fill="#C17F59"/>
      <path d="M8 4 Q-5 -12 -22 2 Q-5 14 8 12" fill="#C17F59"/>
    </g>
    <g transform="translate(190, 215)">
      <path d="M0 12 Q18 0 28 18 Q15 28 0 22 Q-6 16 0 12" fill="#C17F59"/>
      <path d="M-8 4 Q5 -12 22 2 Q5 14 -8 12" fill="#C17F59"/>
    </g>
    
    <!-- Heart -->
    <path d="M120 240 C114 234 102 234 102 246 C102 258 120 270 120 270 C120 270 138 258 138 246 C138 234 126 234 120 240 Z" fill="#C17F59"/>
  </g>
  
  <!-- Text block (right side) -->
  <g transform="translate(280, 55)">
    <text x="0" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="bold" fill="#4A3429">MyHome</text>
    <text x="0" y="95" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="bold" fill="#4A3429">Cookin'</text>
    
    <!-- Decorative line + heart -->
    <line x1="0" y1="115" x2="70" y2="115" stroke="#C17F59" stroke-width="2"/>
    <path d="M90 112 C87 109 82 109 82 115 C82 121 90 128 90 128 C90 128 98 121 98 115 C98 109 93 109 90 112 Z" fill="#C17F59"/>
    <line x1="110" y1="115" x2="180" y2="115" stroke="#C17F59" stroke-width="2"/>
    
    <!-- Domain -->
    <text x="0" y="145" font-family="Georgia, serif" font-size="16" fill="#C17F59">MyHomeCookin.com</text>
  </g>
</svg>
